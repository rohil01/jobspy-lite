name: OCI cleanup (one-off)

# Temporary utility: deletes the orphaned jobspy-vcn left behind by a failed
# Terraform apply (its state was lost before state persistence was fixed),
# which was blocking new applies with a vcn-count LimitExceeded error.
# Keeps the OLDEST jobspy-vcn (the original), deletes newer duplicates
# that have no instances attached.

on:
  workflow_dispatch:

env:
  TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.TF_VAR_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.TF_VAR_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.TF_VAR_PRIVATE_KEY }}
  TF_VAR_region: ${{ secrets.TF_VAR_REGION }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: pip install oci

      - name: Delete orphaned VCNs (newest duplicates only)
        run: |
          python - <<'PY'
          import os, time
          import oci

          cfg = {
              "user": os.environ["TF_VAR_user_ocid"],
              "tenancy": os.environ["TF_VAR_tenancy_ocid"],
              "region": os.environ["TF_VAR_region"],
              "fingerprint": os.environ["TF_VAR_fingerprint"],
              "key_content": os.environ["TF_VAR_private_key"],
          }
          vn = oci.core.VirtualNetworkClient(cfg)
          comp = cfg["tenancy"]

          def retry(fn, desc, tries=15, delay=15):
              for i in range(tries):
                  try:
                      fn()
                      return
                  except Exception as e:
                      msg = str(e)
                      if "404" in msg or "not found" in msg.lower():
                          return  # already gone
                      print(f"  {desc}: {msg[:160]} (attempt {i+1}/{tries})")
                      time.sleep(delay)
              raise RuntimeError(f"{desc} kept failing")

          vcns = vn.list_vcns(comp).data
          print("VCNs found:")
          for v in vcns:
              print(f"  {v.display_name} | {v.lifecycle_state} | created {v.time_created} | {v.id}")

          dupes = sorted(
              [v for v in vcns if v.display_name == "jobspy-vcn"
               and v.lifecycle_state in ("AVAILABLE", "TERMINATING")],
              key=lambda v: v.time_created,
          )[1:]  # keep the oldest (the original)

          if not dupes:
              print("No orphaned duplicates to delete — nothing to do.")
              raise SystemExit(0)

          for vcn in dupes:
              print(f"\nDeleting orphaned VCN {vcn.id} (created {vcn.time_created})")

              # Dependency order: subnets first (they hold the RTs/SLs),
              # then custom route tables/security lists, then IGWs, then VCN.
              for sn in vn.list_subnets(comp, vcn_id=vcn.id).data:
                  retry(lambda sn=sn: vn.delete_subnet(sn.id), f"delete subnet {sn.id}")
              print("  subnets deleted")
              time.sleep(20)  # let detachments settle

              for rt in vn.list_route_tables(comp, vcn_id=vcn.id).data:
                  if rt.display_name != "Default Route Table for " + vcn.display_name:
                      retry(lambda rt=rt: vn.delete_route_table(rt.id), f"delete route table {rt.id}")
              print("  route tables deleted")

              for sl in vn.list_security_lists(comp, vcn_id=vcn.id).data:
                  if sl.display_name != "Default Security List for " + vcn.display_name:
                      retry(lambda sl=sl: vn.delete_security_list(sl.id), f"delete security list {sl.id}")
              print("  security lists deleted")

              for ig in vn.list_internet_gateways(comp, vcn_id=vcn.id).data:
                  retry(lambda ig=ig: vn.delete_internet_gateway(ig.id), f"delete IGW {ig.id}")
              print("  internet gateways deleted")

              retry(lambda: vn.delete_vcn(vcn.id), "delete VCN")
              print(f"  VCN {vcn.id} deletion requested")

          print("\nCleanup done. Remaining VCNs:")
          for v in vn.list_vcns(comp).data:
              print(f"  {v.display_name} | {v.lifecycle_state} | {v.id}")
          PY
