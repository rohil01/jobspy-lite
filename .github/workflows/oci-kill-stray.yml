name: OCI kill stray debug instance (one-off)

on:
  workflow_dispatch:

env:
  TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.TF_VAR_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.TF_VAR_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.TF_VAR_PRIVATE_KEY }}
  TF_VAR_region: ${{ secrets.TF_VAR_REGION }}

jobs:
  kill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: pip install oci

      - name: Terminate stray instances
        run: |
          python - <<'PY'
          import os, time
          import oci

          cfg = {
              "user": os.environ["TF_VAR_user_ocid"],
              "tenancy": os.environ["TF_VAR_tenancy_ocid"],
              "region": os.environ["TF_VAR_region"],
              "fingerprint": os.environ["TF_VAR_fingerprint"],
              "key_content": os.environ["TF_VAR_private_key"],
          }
          comp = cfg["tenancy"]
          compute = oci.core.ComputeClient(cfg)

          instances = compute.list_instances(comp).data
          print("Instances in tenancy root:")
          for i in instances:
              print(f"  {i.display_name} | {i.lifecycle_state} | {i.time_created} | {i.id}")

          strays = [i for i in instances
                    if i.display_name.startswith("jobspy-")
                    and i.lifecycle_state in ("PROVISIONING", "STARTING", "RUNNING", "STOPPED")]

          if not strays:
              print("\nNo stray jobspy-* instances to terminate.")
              raise SystemExit(0)

          for inst in strays:
              print(f"\nTerminating {inst.display_name} ({inst.id})...")
              try:
                  compute.terminate_instance(inst.id)
                  print("  termination requested")
              except oci.exceptions.ServiceError as e:
                  if e.status == 404:
                      print("  already gone")
                  else:
                      raise

          print("\nWaiting for termination to settle...")
          for _ in range(30):
              time.sleep(20)
              remaining = [i for i in compute.list_instances(comp).data
                           if i.display_name.startswith("jobspy-")
                           and i.lifecycle_state not in ("TERMINATED", "TERMINATING")]
              if not remaining:
                  break
          print("Done. Final state:")
          for i in compute.list_instances(comp).data:
              print(f"  {i.display_name} | {i.lifecycle_state}")
          PY
