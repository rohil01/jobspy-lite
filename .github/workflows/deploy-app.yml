name: Deploy app

# Rebuilds the Docker image ON the server and restarts the stack — same path
# as deploy/deploy-oci.sh, but triggered by a push to master (or by hand).
# Requires repo secrets:
#   OCI_HOST     e.g. 129.154.43.128
#   OCI_SSH_USER e.g. ubuntu
#   OCI_SSH_KEY  private key (PEM) matching the instance's authorized key

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "frontend/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "run.py"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OCI_HOST_RAW: ${{ secrets.OCI_HOST }}
      OCI_USER_RAW: ${{ secrets.OCI_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      # Secrets pasted via the web UI often carry a trailing newline; trim
      # everything so user@host:target never splits across lines.
      - name: Resolve target
        run: |
          echo "OCI_HOST=$(printf '%s' "$OCI_HOST_RAW" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "OCI_USER=$(printf '%s' "$OCI_USER_RAW" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          # Fail fast with a clear message instead of a cryptic publickey denial
          if ! ssh-keygen -y -f ~/.ssh/oci_key >/dev/null 2>&1; then
            echo "::error::OCI_SSH_KEY is not a valid private key — it must be the full PEM including the BEGIN/END lines (CRLF endings are fine, they get stripped)."
            exit 1
          fi
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync the working tree (same excludes as deploy-oci.sh). .env lives on
      # the server already — never ship secrets from CI.
      - name: rsync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/oci_key -o IdentitiesOnly=yes" \
            --exclude .git --exclude .venv --exclude node_modules \
            --exclude frontend/dist --exclude data --exclude .env \
            --exclude __pycache__ --exclude .pytest_cache \
            ./ "$OCI_USER@$OCI_HOST":~/app/

      - name: Build + restart (detached), then poll health
        run: |
          SSH="ssh -i ~/.ssh/oci_key -o IdentitiesOnly=yes"
          $SSH "$OCI_USER@$OCI_HOST" \
            'cd ~/app && nohup docker compose up --build -d > build.log 2>&1 & exit 0'
          for i in $(seq 1 40); do
            sleep 15
            if curl -sf -m 5 "http://$OCI_HOST:8000/health" > /dev/null; then
              echo "Healthy after ~$((i*15))s"
              curl -s "http://$OCI_HOST:8000/health"
              exit 0
            fi
          done
          echo "::error::Health check failed after 10 minutes"
          $SSH "$OCI_USER@$OCI_HOST" 'tail -40 ~/app/build.log'
          exit 1
