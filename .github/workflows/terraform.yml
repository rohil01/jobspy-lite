name: Terraform infra

# Plans on every PR touching infra/, applies on push to master (or by hand).
# Requires repo secrets (same OCI API key as the CLI, values from
# Profile → User settings → API keys):
#   TF_VAR_tenancy_ocid, TF_VAR_user_ocid, TF_VAR_fingerprint,
#   TF_VAR_private_key (PEM body), TF_VAR_region,
#   TF_VAR_ssh_public_key
# TF_VAR_* environment variables feed Terraform directly — no tfvars file
# needed in CI.

on:
  push:
    branches: [master]
    paths:
      - "infra/**"
      - "deploy/cloud-init.yaml"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - "deploy/cloud-init.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # comment the plan on PRs

env:
  TF_WORKDIR: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: Validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform plan -input=false -no-color -out=tfplan > plan.txt
          echo "changed=$(grep -cE 'Plan: [1-9][0-9]* (to add|to change)' plan.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.TF_WORKDIR + '/plan.txt', 'utf8');
            const body = `#### Terraform plan\n\`\`\`\n${plan.slice(0, 30000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    needs: plan
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production   # gate with a required reviewer if you want
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: Apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve

      - name: Print public IP
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform output public_ip
